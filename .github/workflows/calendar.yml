name: Live Schedule to Google Calendar

on:
  schedule:
    # 毎朝 6:00 JST (= 21:00 UTC 前日) に実行
    - cron: "0 21 * * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          # Ubuntu 24.04 renamed libasound2 → libasound2t64; create a dummy deb to satisfy playwright's --with-deps
          sudo apt-get install -y libasound2t64
          cd /tmp
          mkdir -p libasound2_dummy/DEBIAN
          printf 'Package: libasound2\nVersion: 1.1.99\nArchitecture: amd64\nMaintainer: CI\nDescription: Dummy libasound2 shim for Ubuntu 24.04\n' \
            > libasound2_dummy/DEBIAN/control
          dpkg-deb --build libasound2_dummy
          sudo dpkg -i libasound2_dummy.deb
          python -m playwright install chromium --with-deps

      - name: Sync live schedule to Google Calendar
        env:
          RUN_MODE: calendar
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
        run: python scripts/main.py
