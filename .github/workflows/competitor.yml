name: Competitor Price Adjustment

on:
  # schedule:
  #   # 毎時 0分に実行（JST: UTC+9 のため、UTC で記述）
  #   - cron: "0 * * * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  adjust-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium
          sudo apt-get install -y --no-install-recommends \
            fonts-liberation libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 \
            libcairo2 libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 \
            libnspr4 libnss3 libpango-1.0-0 libasound2t64 \
            libx11-6 libx11-xcb1 libxcb1 libxcomposite1 libxcursor1 libxdamage1 \
            libxext6 libxfixes3 libxi6 libxkbcommon0 libxrandr2 libxrender1 libxtst6 \
            xdg-utils

      - name: Run competitor mode
        env:
          RUN_MODE: competitor
          SPACEMARKET_EMAIL: ${{ secrets.SPACEMARKET_EMAIL }}
          SPACEMARKET_PASSWORD: ${{ secrets.SPACEMARKET_PASSWORD }}
        run: python scripts/main.py

      - name: Upload price cache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: competitor-price-cache
          path: competitor_price_cache.json
          retention-days: 7
          if-no-files-found: ignore
