name: Live Broadcast Price Adjustment

on:
  # schedule:
  #   # 毎朝 7:00 JST (= 22:00 UTC 前日) に実行
  #   - cron: "0 22 * * *"
  workflow_dispatch:  # 手動実行も可能

jobs:
  adjust-live-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          # Ubuntu 24.04 renamed libasound2 → libasound2t64; create a dummy deb to satisfy playwright's --with-deps
          sudo apt-get install -y libasound2t64
          cd /tmp
          mkdir -p libasound2_dummy/DEBIAN
          printf 'Package: libasound2\nVersion: 1.1.99\nArchitecture: amd64\nMaintainer: CI\nDescription: Dummy libasound2 shim for Ubuntu 24.04\n' \
            > libasound2_dummy/DEBIAN/control
          dpkg-deb --build libasound2_dummy
          sudo dpkg -i libasound2_dummy.deb
          python -m playwright install chromium --with-deps

      - name: Download latest price cache (from competitor run)
        uses: dawidd6/action-download-artifact@v3
        with:
          name: competitor-price-cache
          workflow: competitor.yml
          if_no_artifact_found: ignore
        continue-on-error: true

      - name: Run live mode
        env:
          RUN_MODE: live
          SPACEMARKET_EMAIL: ${{ secrets.SPACEMARKET_EMAIL }}
          SPACEMARKET_PASSWORD: ${{ secrets.SPACEMARKET_PASSWORD }}
        run: python scripts/main.py
